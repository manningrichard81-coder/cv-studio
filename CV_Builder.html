<style>
:root{
  --page:#f9f9f7; --surface:#ffffff; --text:#0b0b0b; --muted:#5f6368;
  --line:#e6e6e2; --accent:#2a78d6; --aqua:#1baf7a; --warn:#fab219; --danger:#d03b3b;
  --shadow:0 1px 3px rgba(20,20,20,.06),0 8px 24px rgba(20,20,20,.05);
}
[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --text:#ffffff; --muted:#9a9a96;
  --line:#2b2b29; --accent:#3987e5;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}

/* ---------- shell layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:218px;flex:0 0 218px;background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--aqua));
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
.brand b{font-size:15px;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:10px;
  cursor:pointer;text-align:left;color:var(--muted);font-weight:600;font-size:13.5px}
.navitem svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}
.navitem:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--text)}
.navitem.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.sidefoot{margin-top:auto;padding:10px 8px 2px;display:flex;flex-direction:column;gap:8px}
.dirty{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;visibility:hidden;min-height:18px}
.dirty .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dirty.on{visibility:visible}
.ver{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:10px;
  padding:12px 22px;background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.content{padding:22px;max-width:1020px;width:100%;margin:0 auto}
.page{display:none}.page.on{display:block}
.pagehead h1{margin:2px 0 4px;font-size:22px;letter-spacing:-.2px}
.pagehead .sub{margin:0 0 18px;color:var(--muted);max-width:66ch}

/* ---------- cards & controls ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
  padding:16px 18px;margin:0 0 16px}
.card-warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.cardtitle{font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:10px 0 0}
.empty{color:var(--muted);padding:8px 0}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow.center{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.07);color:#fff}
.btn-ghost{background:transparent}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--muted);background:var(--surface)}
.chip-ok{color:var(--aqua);border-color:color-mix(in srgb,var(--aqua) 45%,var(--line))}
.chip-info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.warnrow{padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);
  color:color-mix(in srgb,var(--warn) 70%,var(--text));font-size:13px;margin:6px 0}
.ibtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
  color:var(--muted);font-size:13px;line-height:1;padding:0}
.ibtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn.danger:hover{border-color:var(--danger);color:var(--danger)}
.ordbtns{display:inline-flex;gap:4px;margin-left:auto}

/* data page */
.filemeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filename{font-weight:700}
.sheetgrid{display:flex;flex-direction:column}
.sheetrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.sheetrow:last-child{border-bottom:0}
.sheetname{font-weight:600;min-width:150px}
.rowcount{color:var(--muted);font-size:12.5px;min-width:60px}

/* sections page */
.lockchip{font-size:10.5px;text-transform:none;letter-spacing:.2px;color:var(--muted);border:1px dashed var(--line);
  border-radius:999px;padding:2px 9px;font-weight:600}
.idlist{display:flex;flex-direction:column;gap:4px}
.idrow{display:flex;align-items:center;gap:9px;padding:4px 4px;border-radius:9px}
.idrow:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.idrow.off .idname,.idrow.off .idvalin{opacity:.4;text-decoration:line-through}
.idname{font-weight:600;font-size:12.5px;color:var(--muted);width:110px;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idnamein{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px}
.idnamein:hover,.idnamein:focus{border-color:var(--line);background:var(--page);outline:none}
.idvalin{flex:1;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;font-size:13px;min-width:0}
.idvalin:hover,.idvalin:focus{border-color:var(--line);background:var(--page);outline:none}
.idadd{margin-top:12px}
.seccard.disabled .recs,.seccard.disabled .sectitle{opacity:.45}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sectitle{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;font-weight:700;font-size:15px;min-width:120px;flex:1}
.sectitle:hover,.sectitle:focus{border-color:var(--line);background:var(--page);outline:none}
.modesel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:0 0 34px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + span{background:var(--aqua)}
.switch input:checked + span:before{transform:translateX(14px)}
.recs{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.recrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px}
.recrow:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.recrow.off{opacity:.5}
.recrow label{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;flex:1}
.reclbl{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow input,.addrow select{border:1px solid var(--line);background:var(--page);border-radius:10px;padding:7px 11px;font-size:13px}
.addrow input{flex:1;min-width:140px}

/* design page */
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tplcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;box-shadow:var(--shadow);text-align:left}
.tplcard.on{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.tplthumb{width:52px;height:68px;border-radius:6px;border:1px solid var(--line);background:#fff;position:relative;flex:0 0 52px;overflow:hidden}
.tplthumb.tpl-classic i{position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent)}
.tplthumb.tpl-classic b{position:absolute;top:12px;left:7px;right:7px;height:4px;background:#c9d4e2;border-radius:2px;box-shadow:0 10px 0 #e2e8f0,0 20px 0 #e2e8f0,0 30px 0 #e2e8f0}
.tplthumb.tpl-sidebar i{position:absolute;top:0;bottom:0;left:0;width:18px;background:#1e3a5f}
.tplthumb.tpl-sidebar b{position:absolute;top:10px;left:24px;right:6px;height:4px;background:#c9d4e2;border-radius:2px;box-shadow:0 10px 0 #e2e8f0,0 20px 0 #e2e8f0,0 30px 0 #e2e8f0}
.tplmeta{display:flex;flex-direction:column;gap:2px;flex:1}
.tplname{font-weight:700;font-size:13.5px}
.tpldesc{font-size:12px;color:var(--muted)}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.palcard{display:flex;align-items:center;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.palcard.on{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.palcard .sw{width:20px;height:20px;border-radius:6px;flex:0 0 20px}
.palname{font-weight:700;font-size:13px;margin-left:4px;flex:1;text-align:left}
.photorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photothumb{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}

/* ---------- the CV itself ---------- */
.cvwrap{display:flex;justify-content:center}
.cv{width:210mm;max-width:100%;min-height:120mm;padding:14mm 15mm;
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  font-size:10.3pt;line-height:1.42;border-top:5px solid var(--cva);
  /* effective colours flip with the workspace theme; print + Word stay light */
  --p:#ffffff; --t:#2a2a2a; --mut:#5a5a5a;
  --hEff:var(--cvh); --aEff:var(--cva); --bEff:var(--cvb); --rEff:var(--cvr);
  background:var(--p); color:var(--t)}
[data-theme="dark"] .cv{
  --p:#161619; --t:#e8e8e6; --mut:#a3a39f;
  --hEff:color-mix(in srgb,var(--cvh) 34%,#e4eaf2);
  --aEff:color-mix(in srgb,var(--cva) 62%,#cfe0f5);
  --bEff:color-mix(in srgb,var(--cvb) 66%,#d9e8dd);
  --rEff:color-mix(in srgb,var(--cvr) 26%,#2e2e33)}
.cv .ov{border-radius:3px}
.cv .ov:hover{outline:1.5px dashed color-mix(in srgb,var(--aEff) 45%,transparent);cursor:text}
.cv .ov[contenteditable]{outline:1.5px solid var(--aEff);background:color-mix(in srgb,var(--aEff) 8%,transparent)}
.cv .ov.edited{border-bottom:1.5px dotted var(--bEff)}
.cv-id{margin:0 0 6mm;display:flex;gap:6mm;align-items:flex-start}
.cv-idtext{flex:1;min-width:0}
.cv-photo{width:26mm;height:26mm;border-radius:50%;object-fit:cover;flex:0 0 26mm;border:2.5px solid var(--rEff)}
.cv-name{font-size:23pt;font-weight:800;letter-spacing:-.3px;color:var(--hEff);line-height:1.12}
.cv-title{font-size:11.5pt;font-weight:700;color:var(--aEff);margin-top:1mm}
.cv-meta{font-size:8.8pt;color:var(--mut);margin-top:2mm}
.dotsep{margin:0 6px;color:color-mix(in srgb,var(--mut) 55%,transparent)}
.cv-h{font-size:9.5pt;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--aEff);
  border-bottom:1px solid var(--rEff);padding-bottom:1.2mm;margin:5.5mm 0 2.6mm}
.cv-sec:first-child .cv-h{margin-top:0}
.cv-p{margin:0 0 2mm}
.cv-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.cv-tile{border:1px solid var(--rEff);border-left:3px solid var(--aEff);border-radius:2.5mm;
  padding:2.8mm 3.2mm;background:color-mix(in srgb,var(--aEff) 4%,var(--p))}
.cv-tileh{font-weight:800;color:var(--hEff);font-size:9.6pt;line-height:1.25;margin:0 0 1mm}
.cv-tiled{font-size:8.3pt;color:var(--mut);line-height:1.35}
.cv-skillrow{margin:0 0 1.4mm}
.cv-skillcat{font-weight:700;color:var(--hEff)}
.cv-skillcat:after{content:":  "}
.cv-role{margin:0 0 3.4mm}
.cv-roleline{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cv-rolet{font-weight:800;color:var(--hEff);font-size:10.8pt}
.cv-roleco{font-weight:700;color:var(--bEff)}
.cv-roleco:not(:empty):before{content:"\2014\00a0"}
.cv-roledates{margin-left:auto;color:var(--mut);font-size:8.8pt}
.cv-rolesum{margin:.6mm 0 1mm;font-style:italic;color:color-mix(in srgb,var(--t) 88%,var(--mut))}
.cv-ul{margin:.4mm 0 0;padding-left:4.6mm}
.cv-ul li{margin:0 0 .9mm}
.cv-ul li::marker{color:var(--aEff)}
.cv-cred{margin:0 0 1.2mm}
.cv-credx{color:var(--mut)}
.cv-gen{margin:0 0 1.4mm}
.cv-genl{font-weight:700;color:var(--hEff);margin-right:6px}

/* --- sidebar template --- */
.cv.tpl-sidebar{display:grid;grid-template-columns:60mm 1fr;padding:0;overflow:hidden;border-top:0}
.cv-side{background:var(--cvh);padding:12mm 7mm;min-width:0;
  --t:#eef2f7;--mut:#c7d2e1;--hEff:#ffffff;--aEff:#ffffff;
  --bEff:color-mix(in srgb,var(--cvb) 45%,#ffffff);
  --rEff:color-mix(in srgb,var(--cvh) 58%,#ffffff);
  --p:var(--cvh); color:var(--t)}
.cv-sidename{font-size:18pt;font-weight:800;color:#fff;line-height:1.18;letter-spacing:.3px;margin:0 0 7mm}
.cv-side .cv-tiles{grid-template-columns:1fr}
.cv-maincol{padding:12mm 10mm;min-width:0}
.cv.tpl-sidebar .cv-maincol .cv-id{margin-bottom:4mm}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--text);color:var(--page);
  padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* responsive */
@media (max-width:860px){
  .shell{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;gap:6px;
    padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 0}.brand b{display:none}
  .nav{flex-direction:row}
  .navitem{padding:7px 11px;white-space:nowrap}
  .navitem svg{display:none}
  .sidefoot{margin:0 0 0 auto;flex-direction:row;align-items:center;padding:0}.ver{display:none}
  .dirty{min-height:0}.dirty span:last-child{display:none}
  .cv{padding:10mm 8mm}
  .cv.tpl-sidebar{grid-template-columns:1fr}
  .cv-side{padding:8mm}
  .cv-tiles{grid-template-columns:1fr}
}

/* print: CV only, always light */
@media print{
  body{background:#fff}
  .sidebar,.topbar,.pagehead,.btnrow,.noprint,#toast{display:none !important}
  .page{display:none !important}
  #page-preview{display:block !important}
  .content{padding:0;max-width:none}
  .cv{border:1px solid transparent;border-radius:0;box-shadow:none;width:auto;min-height:0;padding:0;border-top:4px solid var(--cva);
    --p:#ffffff !important; --t:#2a2a2a !important; --mut:#5a5a5a !important;
    --hEff:var(--cvh) !important; --aEff:var(--cva) !important; --bEff:var(--cvb) !important; --rEff:var(--cvr) !important;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .cv.tpl-sidebar{border-top:0;padding:0}
  .cv-side{--t:#eef2f7 !important;--mut:#c7d2e1 !important;--hEff:#ffffff !important;--aEff:#ffffff !important;
    --bEff:color-mix(in srgb,var(--cvb) 45%,#ffffff) !important;
    --rEff:color-mix(in srgb,var(--cvh) 58%,#ffffff) !important}
  .cv .ov{outline:none !important;border-bottom:0 !important}
}
</style>
</head>

      <button class="navitem" data-page="export"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v3h16v-3"/></svg>Export</button>

      <div class="page" id="page-design"></div>
      <div class="page" id="page-export"></div>
    </div>
  </div>
</div>

<script>/* CV Studio — application logic. Runs after xlsx + docx libs. */
(function () {
'use strict';

/* ---------- pristine source capture (for Save app) ---------- */
var ORIGINAL = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* ---------- constants ---------- */
var PALETTES = {
  'navy-teal':      { name: 'Navy / Teal',      heading: '1E3A5F', accent: '2A78D6', accent2: '1BAF7A', rule: 'D7E2EF' },
  'charcoal-amber': { name: 'Charcoal / Amber', heading: '23272B', accent: '4A5157', accent2: 'C98800', rule: 'E2E4E6' },
  'forest-sage':    { name: 'Forest / Sage',    heading: '1F4430', accent: '2F6B45', accent2: '6E9160', rule: 'DCE7DE' },
  'burgundy-slate': { name: 'Burgundy / Slate', heading: '4E1F2A', accent: '7D2A3A', accent2: '5A6B7D', rule: 'ECDFE1' }
};
var TEMPLATES = {
  'classic': { name: 'Classic', desc: 'Single column, accent top rule — the original layout.' },
  'sidebar': { name: 'Sidebar', desc: 'Two columns with a full-height colour band on the left.' }
};
var STANDARD_SECTIONS = [
  { title: 'Profile',           sheet: 'Profile',           mode: 'single' },
  { title: 'Value Delivered',   sheet: 'Value Delivered',   mode: 'multi'  },
  { title: 'Career Highlights', sheet: 'Career Highlights', mode: 'multi'  },
  { title: 'Core Skills',       sheet: 'Skills',            mode: 'multi'  },
  { title: 'Experience',        sheet: 'Experience',        mode: 'multi'  },
  { title: 'Education',         sheet: 'Education',         mode: 'multi'  },
  { title: 'Certifications',    sheet: 'Certifications',    mode: 'multi'  }
];
var RESERVED_SHEETS = { 'identity': 1, 'sections': 1, 'readme': 1 };
var TILE_MAX = 3;
var TILE_LIMITS = { headline: 50, detail: 100 };
var SIDE_DEFAULT = /skill|education|certification|language|interest/i;

/* ---------- state ---------- */
var DEFAULT_STATE = {
  version: 2, palette: 'navy-teal', template: 'classic', theme: 'light',
  data: null, /* { fileName, importedAt, sheets: {name: [rowObj...]} } */
  photo: { enabled: false, data: null },
  identity: { hidden: [], overrides: {}, extra: [] },
  sections: [] /* {id,title,sheet,mode,place,enabled,selected:[key],overrides:{},custom} */
};
var state, dirty = false, currentPage = 'data';

function loadState() {
  try {
    var seed = document.getElementById('seed');
    var parsed = JSON.parse(seed.textContent || 'null');
    state = parsed && parsed.version ? parsed : JSON.parse(JSON.stringify(DEFAULT_STATE));
  } catch (e) { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); }
  /* migrations / defaults */
  state.version = 2;
  state.template = state.template || 'classic';
  state.photo = state.photo || { enabled: false, data: null };
  state.identity = state.identity || { hidden: [], overrides: {}, extra: [] };
  state.identity.extra = state.identity.extra || [];
  (state.sections || []).forEach(function (s) {
    if (!s.place) s.place = SIDE_DEFAULT.test(s.sheet) || SIDE_DEFAULT.test(s.title) ? 'side' : 'main';
  });
}
function markDirty() { dirty = true; document.getElementById('dirtyDot').classList.add('on'); }
function clearDirty() { dirty = false; document.getElementById('dirtyDot').classList.remove('on'); }

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function col(row, name) {
  if (!row) return '';
  var keys = Object.keys(row), n = name.toLowerCase();
  for (var i = 0; i < keys.length; i++) if (keys[i].toLowerCase().trim() === n) return String(row[keys[i]] == null ? '' : row[keys[i]]).trim();
  return '';
}
function hasCol(rows, name) { for (var i = 0; i < rows.length; i++) if (col(rows[i], name) !== '') return true; return false; }
function sheetRows(name) { return (state.data && state.data.sheets && state.data.sheets[name]) || null; }
function rowKeys(rows) {
  var counts = {};
  rows.forEach(function (r) { var l = col(r, 'label'); counts[l] = (counts[l] || 0) + 1; });
  return rows.map(function (r, i) { var l = col(r, 'label'); return (l && counts[l] === 1) ? l : (l || 'row') + '#' + i; });
}
function detectType(rows) {
  if (!rows || !rows.length) return 'generic';
  if (hasCol(rows, 'headline')) return 'tiles';
  if (hasCol(rows, 'company') || (hasCol(rows, 'title') && (hasCol(rows, 'start') || hasCol(rows, 'dates')))) return 'role';
  if (hasCol(rows, 'items')) return 'skills';
  if (hasCol(rows, 'name')) return 'credential';
  if (hasCol(rows, 'text')) return 'text';
  return 'generic';
}
function clampTile(txt, key) {
  var lim = TILE_LIMITS[key];
  if (!lim || txt.length <= lim) return txt;
  return txt.slice(0, lim - 1).replace(/\s+\S*$/, '') + '\u2026';
}
function uid() { return 's' + Math.random().toString(36).slice(2, 9); }
function download(blob, filename) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function mixHex(a, b, ratio) { /* ratio = share of b */
  function h2(x, i) { return parseInt(x.substr(i, 2), 16); }
  var out = '';
  for (var i = 0; i < 6; i += 2) {
    var v = Math.round(h2(a, i) * (1 - ratio) + h2(b, i) * ratio);
    out += ('0' + v.toString(16)).slice(-2);
  }
  return out.toUpperCase();
}

/* ---------- Excel import ---------- */
function defaultSelected(mode, type, keys) {
  if (mode === 'single') return keys.slice(0, 1);
  if (type === 'tiles') return keys.slice(0, TILE_MAX);
  return keys.slice();
}
function importWorkbook(buf, fileName) {
  var wb = XLSX.read(buf, { type: 'array' });
  var sheets = {};
  wb.SheetNames.forEach(function (n) {
    sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '', raw: false });
  });
  state.data = { fileName: fileName, importedAt: new Date().toISOString().slice(0, 10), sheets: sheets };

  var catalogue = [];
  var cfg = sheets['Sections'];
  if (cfg && cfg.length) {
    cfg.slice().sort(function (a, b) { return (parseFloat(col(a, 'order')) || 99) - (parseFloat(col(b, 'order')) || 99); })
      .forEach(function (r) {
        var sh = col(r, 'sheet'), ti = col(r, 'title') || sh;
        if (sh) catalogue.push({ title: ti, sheet: sh, mode: /single/i.test(col(r, 'mode')) ? 'single' : 'multi' });
      });
  } else { catalogue = STANDARD_SECTIONS.slice(); }
  Object.keys(sheets).forEach(function (n) {
    if (RESERVED_SHEETS[n.toLowerCase()]) return;
    if (!catalogue.some(function (c) { return c.sheet === n; }) &&
        !state.sections.some(function (s) { return s.sheet === n; })) {
      catalogue.push({ title: n, sheet: n, mode: 'multi', extra: true });
    }
  });

  var next = [];
  catalogue.forEach(function (c) {
    var existing = state.sections.filter(function (s) { return s.sheet === c.sheet && !s.custom; })[0];
    var rows = sheets[c.sheet] || [];
    var keys = rowKeys(rows), type = detectType(rows);
    if (existing) {
      existing.selected = existing.selected.filter(function (k) { return keys.indexOf(k) >= 0; });
      if (existing.mode === 'single' && !existing.selected.length && keys.length) existing.selected = [keys[0]];
      if (type === 'tiles') existing.selected = existing.selected.slice(0, TILE_MAX);
      next.push(existing);
    } else {
      next.push({ id: uid(), title: c.title, sheet: c.sheet, mode: c.mode,
        place: SIDE_DEFAULT.test(c.sheet) || SIDE_DEFAULT.test(c.title) ? 'side' : 'main',
        enabled: !c.extra, custom: false,
        selected: defaultSelected(c.mode, type, keys), overrides: {} });
    }
  });
  state.sections.forEach(function (s) { if (s.custom && sheets[s.sheet]) next.push(s); });
  state.sections = next;
  markDirty();
}

/* ---------- resolve model (shared by preview + word export) ---------- */
function identityModel() {
  var rows = sheetRows('Identity') || [];
  var out = rows.map(function (r) {
    var f = col(r, 'field'), v = col(r, 'value');
    var ov = state.identity.overrides[f];
    return { field: f, value: ov != null ? ov : v, source: v, edited: ov != null,
             hidden: state.identity.hidden.indexOf(f) >= 0, extra: false };
  }).filter(function (x) { return x.field; });
  state.identity.extra.forEach(function (x) {
    out.push({ field: x.field, value: x.value, source: null, edited: false,
               hidden: state.identity.hidden.indexOf(x.field) >= 0, extra: true, xid: x.id });
  });
  return out;
}
function sectionModel(sec) {
  var rows = sheetRows(sec.sheet);
  if (!rows) return null;
  var keys = rowKeys(rows);
  var byKey = {}; rows.forEach(function (r, i) { byKey[keys[i]] = r; });
  var chosen = sec.selected.filter(function (k) { return byKey[k]; });
  var records = chosen.map(function (k) {
    var src = byKey[k], out = {}, cols = Object.keys(src);
    cols.forEach(function (c) {
      var ov = sec.overrides[k + '||' + c.toLowerCase().trim()];
      out[c] = ov != null ? ov : String(src[c] == null ? '' : src[c]);
    });
    return { key: k, row: out, src: src };
  });
  return { sec: sec, type: detectType(rows), records: records, allRows: rows, allKeys: keys };
}
function tileWarnings(m) {
  var out = [];
  m.records.forEach(function (rec) {
    ['headline', 'detail'].forEach(function (cn) {
      var v = col(rec.row, cn);
      if (v.length > TILE_LIMITS[cn]) out.push('\u201c' + esc(col(rec.row, 'label') || rec.key) + '\u201d ' + cn + ' is ' + v.length + ' chars \u2014 tiles trim at ' + TILE_LIMITS[cn] + '.');
    });
  });
  return out;
}

/* ---------- Excel generation (starter workbook + current-data export) ---------- */
var STARTER_SPEC = [
  { name: 'ReadMe', widths: [112], rows: [
    ['CV Builder \u2014 data workbook'], [''],
    ['This workbook is the data source for CV_Builder.html. Fill it in offline, then load it on the app\u2019s Data page.'],
    ['Row 1 of every sheet is the header row \u2014 keep the header names, add as many data rows as you like.'], [''],
    ['How it is structured'],
    ['\u2022 Identity \u2014 key/value pairs rendered as the locked block at the top of every CV.'],
    ['\u2022 Sections \u2014 the catalogue of CV sections: display Title, source Sheet, and Mode.'],
    ['    Mode "single" = the app lets you pick ONE record from the sheet (e.g. one Profile variant).'],
    ['    Mode "multi"  = the app lets you tick MANY records and reorder them (e.g. Career Highlights).'],
    ['\u2022 Every other sheet holds the records for one section. The Label column is how a record appears in the app pickers.'], [''],
    ['Adding your own section'],
    ['1. Add a new sheet (e.g. "Publications") with a Label column plus your content columns.'],
    ['2. Add a row to the Sections sheet pointing at it. Load the file in the app. Done.'], [''],
    ['Column conventions the app understands'],
    ['\u2022 Text \u2014 long-form paragraph content (Profile).'],

function wsFromAoa(rows, widths) {
  var ws = XLSX.utils.aoa_to_sheet(rows);
  if (widths) ws['!cols'] = widths.map(function (w) { return { wch: w }; });
  return ws;
}
function downloadStarterWorkbook() {
  var wb = XLSX.utils.book_new();
  STARTER_SPEC.forEach(function (s) { XLSX.utils.book_append_sheet(wb, wsFromAoa(s.rows, s.widths), s.name); });
  var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  download(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'CV_Data_Starter.xlsx');
  toast('Starter workbook downloaded \u2014 fill it in, then load it here');
}
function downloadCurrentData() {
  if (!state.data) { toast('No data loaded yet'); return; }
  var wb = XLSX.utils.book_new();
  Object.keys(state.data.sheets).forEach(function (n) {
    var rows = state.data.sheets[n];
    var headers = [];
    rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (headers.indexOf(k) < 0) headers.push(k); }); });
    var aoa = [headers.length ? headers : ['']];
    rows.forEach(function (r) { aoa.push(headers.map(function (hd) { return r[hd] != null ? r[hd] : ''; })); });
    var widths = headers.map(function (hd, ci) {
      var w = String(hd).length;
      rows.forEach(function (r) {
        String(r[hd] == null ? '' : r[hd]).split('\n').forEach(function (l) { if (l.length > w) w = l.length; });
      });
      return Math.max(10, Math.min(w + 2, 100));
    });
    XLSX.utils.book_append_sheet(wb, wsFromAoa(aoa, widths), n.slice(0, 31));
  });
  var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  var base = (state.data.fileName || 'CV_Data.xlsx').replace(/\.(xlsx|xlsm)$/i, '');
  download(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), base + '_Export.xlsx');
  toast('Current data exported \u2014 edit in Excel, then Refresh to load it back');
}

/* ---------- inline editing ---------- */
function wireInlineEdit(root) {
  root.querySelectorAll('.ov').forEach(function (elv) {
    var path = elv.getAttribute('data-ov');
    if (isEdited(path)) elv.classList.add('edited');
    elv.addEventListener('click', function () {
      if (elv.isContentEditable) return;
      elv.setAttribute('contenteditable', 'plaintext-only');
      if (!elv.isContentEditable) elv.setAttribute('contenteditable', 'true');
      elv.focus();

      r.selectNodeContents(elv); sel.removeAllRanges(); sel.addRange(r); sel.collapseToEnd();
    });

      elv.removeAttribute('contenteditable');
      applyOverride(path, elv.textContent);
    });
    elv.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); elv.blur(); }
      if (e.key === 'Escape') { e.preventDefault(); renderPreview(); }
    });
  });
}
function isEdited(path) {

  if (p[0] === 'idx') return false;
  var sec = state.sections.filter(function (s) { return s.id === p[0]; })[0];
  if (!sec) return false;
  var cn = p[2].split('#')[0];
  return sec.overrides[p[1] + '||' + cn] != null;
}

    if (text === src) delete state.identity.overrides[p[1]];

  }
  if (p[0] === 'idx') {
    var x = state.identity.extra.filter(function (e) { return e.id === p[1]; })[0];
    if (x) { x.value = text; markDirty(); renderSections(); renderPreview(); }

  }

  var key = p[1], colref = p[2], cn = colref.split('#')[0], part = colref.split('#')[1];
  var m = sectionModel(sec); if (!m) return;
  var rows2 = m.allRows, keys = m.allKeys, src2 = '';
  var i = keys.indexOf(key); if (i >= 0) src2 = col(rows2[i], cn);

  if (m.type === 'tiles' && TILE_LIMITS[cn] && text.length > TILE_LIMITS[cn]) {
    text = text.slice(0, TILE_LIMITS[cn]).trim();
    toast('Tiles are limited to ' + TILE_LIMITS[cn] + ' characters \u2014 trimmed');
  }
  var newVal;
  if (part != null) { /* multi-line column: replace one visible line */
    var cur = sec.overrides[key + '||' + cn] != null ? sec.overrides[key + '||' + cn] : src2;
    var vis = [], raw = cur.split('\n');
    raw.forEach(function (l, ri) { if (l.trim()) vis.push(ri); });

}

function processPhoto(dataUrl) {
  function done(d) { state.photo.data = d; state.photo.enabled = true; markDirty(); renderDesign(); renderPreview(); toast('Photo set'); }
  try {
    var img = new Image();
    img.onload = function () {
      try {
        var S = 280, c = document.createElement('canvas');
        c.width = S; c.height = S;
        var ctx = c.getContext('2d');
        var side = Math.min(img.width, img.height);

    };

    img.src = dataUrl;
  } catch (e) { done(dataUrl); }
}

  var idm = identityModel().filter(function (f) { return !f.hidden; });
  var pick = function (n) { var f = idm.filter(function (x) { return x.field.toLowerCase() === n; })[0]; return f ? f.value : ''; };
  var nameV = pick('name'), jtV = pick('job title');
  var meta = idm.filter(function (f) { var l = f.field.toLowerCase(); return l !== 'name' && l !== 'job title'; })
                .map(function (f) { return f.value; }).filter(Boolean);
  var ph = photoBytes();
  function photoPara(align) {
    return para({ alignment: align || D.AlignmentType.RIGHT,
      children: [new D.ImageRun({ data: ph.data, type: ph.type, transformation: { width: 88, height: 88 } })] });
  }

  var children;
  if (state.template === 'sidebar') {
    var sideKids = [para({ children: runs([{ text: nameV, bold: true, size: 38, color: 'FFFFFF' }]), spacing: { after: 200 } })]
                   .concat(placeSecs('side', SIDE, mm(48)));
    var mainTop;
    var titleParas = [];
    if (jtV) titleParas.push(para({ children: runs([{ text: jtV, bold: true, size: 26, color: MAIN.acc }]), spacing: { after: 60 } }));
    if (meta.length) titleParas.push(para({ children: runs([{ text: meta.join('   \u00b7   '), size: 17, color: MAIN.mut }]), spacing: { after: 120 },
      border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: MAIN.rule, space: 6 } } }));
    if (ph) {
      mainTop = [new D.Table({ rows: [new D.TableRow({ children: [
        new D.TableCell({ children: titleParas, width: { size: 80, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS, verticalAlign: D.VerticalAlign.TOP }),
        new D.TableCell({ children: [photoPara()], width: { size: 20, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS, verticalAlign: D.VerticalAlign.TOP })
      ] })], width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS })];
    } else mainTop = titleParas;
    var mainKids = mainTop.concat(placeSecs('main', MAIN, mm(105)));
    children = [new D.Table({
      rows: [new D.TableRow({ children: [
        new D.TableCell({ children: sideKids, shading: { fill: pal.heading },
          width: { size: 33, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS,
          margins: { top: 260, bottom: 260, left: 260, right: 260 }, verticalAlign: D.VerticalAlign.TOP }),
        new D.TableCell({ children: mainKids,
          width: { size: 67, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS,
          margins: { top: 260, bottom: 260, left: 300, right: 40 }, verticalAlign: D.VerticalAlign.TOP })
      ] })],
      width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS,
      columnWidths: [3368, 6837]
    })];
  } else {
    var headParas = [];
    if (nameV) headParas.push(para({ children: runs([{ text: nameV, bold: true, size: 52, color: MAIN.head }]), spacing: { after: 40 } }));
    if (jtV) headParas.push(para({ children: runs([{ text: jtV, bold: true, size: 24, color: MAIN.acc }]), spacing: { after: 60 } }));
    if (meta.length) headParas.push(para({ children: runs([{ text: meta.join('   \u00b7   '), size: 18, color: MAIN.mut }]), spacing: { after: 120 },
      border: { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: MAIN.rule, space: 6 } } }));
    if (ph) {
      children = [new D.Table({ rows: [new D.TableRow({ children: [
        new D.TableCell({ children: headParas, width: { size: 82, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS, verticalAlign: D.VerticalAlign.TOP }),
        new D.TableCell({ children: [photoPara()], width: { size: 18, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS, verticalAlign: D.VerticalAlign.TOP })
      ] })], width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: NOBORDERS })];
    } else children = headParas;
    children = children.concat(placeSecs('main', MAIN, mm(180)));
  }

  var doc = new D.Document({
    numbering: { config: [{ reference: 'cvb', levels: [{ level: 0, format: D.LevelFormat.BULLET, text: '\u2022', alignment: 'left',
      style: { paragraph: { indent: { left: mm(6), hanging: mm(3.5) } } } }] }] },
    styles: { default: { document: { run: { font: 'Calibri' } } } },
    sections: [{ properties: { page: { size: { width: mm(210), height: mm(297) }, margin: { top: mm(12), bottom: mm(12), left: mm(15), right: mm(15) } } }, children: children }]
  });
  var nameForFile = (pick('name') || 'CV').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
  D.Packer.toBlob(doc).then(function (blob) {
    download(blob, nameForFile + '_CV.docx');
    toast('Word document created');
  }).catch(function (e) { toast('Word export failed: ' + e.message); });
}

/* ================================================================
   shell: nav, theme, boot
================================================================ */
function go(page) {
  currentPage = page;
  document.querySelectorAll('.navitem').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-page') === page); });
  document.querySelectorAll('.page').forEach(function (p) { p.classList.toggle('on', p.id === 'page-' + page); });
  window.scrollTo(0, 0);
}
function wireStarter(root) {
  root.querySelectorAll('[data-starter]').forEach(function (b) {
    b.addEventListener('click', downloadStarterWorkbook);
  });
}
function wireGo(root) {
  root.querySelectorAll('[data-go]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); go(a.getAttribute('data-go')); });
  });
}
function renderAll() { renderData(); renderSections(); renderPreview(); renderDesign(); renderExport(); }

function boot() {
  loadState();
  document.documentElement.setAttribute('data-theme', state.theme || 'light');
  document.querySelectorAll('.navitem').forEach(function (n) {
    n.addEventListener('click', function () { go(n.getAttribute('data-page')); });
  });
  document.getElementById('themeBtn').addEventListener('click', function () {
    state.theme = (state.theme === 'dark' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', state.theme);
    markDirty();
  });
  document.getElementById('saveBtn').addEventListener('click', saveApp);
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('beforeprint', function () { go('preview'); });
  renderAll();
  go(state.data ? 'preview' : 'data');
  clearDirty();
}
boot();
window.__cv = { importWorkbook: importWorkbook, getState: function () { return state; },
  exportWord: exportWord, saveApp: saveApp, renderAll: renderAll, go: go,
  setDownloadHook: function (fn) { download = fn; } };
})();
</script>
</body>
</html>
